    Projects:
      - name: An Intelligent System for 24/7 Real-Time Traffic Surveillance on Edge Devices
        summary: This project focuses on developing an intelligent traffic surveillance system capable of operating 24/7 in real-time on edge devices. The system leverages advanced computer vision techniques to enhance traffic monitoring, improve road safety, and optimize traffic flow, even under challenging conditions such as low-light and adverse weather.
        highlights:
          - Traffic Surveillance System
          - Large-Scale Urban Traffic Dataset
          - Real-Time Edge Processing
          - Low-Light Image Enhancement
          - De-weathering & Image Restoration
          - Road Segmentation & Lane Detection
          - Vehicle Detection & Tracking
          - Vehicle Reidentification
          - Speed Estimation
          - Traffic Flow Estimation
          - Congestion Analysis
          - Anomaly Detection
        start_date: 2021-01-01
        end_date: 2028-12-31
        # url:

      - name: Real-Time Scene Understanding Technology in Complex Traffic and Bad Weather
        summary: This project aims to develop advanced computer vision algorithms for real-time scene understanding in complex traffic scenarios and adverse weather conditions. The focus is on enhancing the perception capabilities of autonomous vehicles, enabling them to navigate safely and efficiently in challenging environments.
        highlights:
          - Autonomous Vehicle Perception
          - Semantic Segmentation
          - Low-Light Image Enhancement
          - Adverse Weather Image Restoration
        start_date: 2020-01-01
        end_date: 2022-12-31
        # url:

      - name: Development of A Smartphone-based Laser Measurement System for Assessment of Gap, Flush, and Curvature in Car Body
        summary: This project focuses on creating a portable and user-friendly solution for automotive quality control, leveraging advanced computer vision techniques and mobile application development to facilitate accurate measurements in real-time.
        highlights:
          - Automotive Quality Control
          - Car Body Inspection
          - Gap & Flush Measurement
          - Surface Curvature Measurement
          - Laser Triangulation
          - Handheld Measurement Device
          - Mobile Application Development
        start_date: 2018-01-01
        end_date: 2021-12-31
        # url:

      - name: Piloting Project on the Intelligent Traffic System of Ho Chi Minh City
        summary: This project aimed to develop and implement an intelligent traffic system in Ho Chi Minh City, utilizing advanced computer vision techniques to enhance traffic management and monitoring. The system was designed to improve traffic flow, reduce congestion, and increase road safety through real-time data analysis and decision-making.
        highlights:
          - Intelligent Traffic Systems (ITS)
          - CCTV Networks
          - Vehicle Detection & Tracking
          - Traffic Flow Estimation
          - Heavy Occlusion Handling
          - Real-Time Processing
          - Real-World Deployment
        start_date: 2015-01-01
        end_date: 2017-12-31
        # url:

